name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发
    inputs:
      tag:
        description: '要发布的标签（如 v0.2.0），留空则只执行构建'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        pip install -e .
    
    - name: Build Worker EXE
      run: |
        pyinstaller --onefile --windowed --name tc-worker-gui `
          --hidden-import=transcoder_cluster `
          --hidden-import=transcoder_cluster.core `
          --hidden-import=transcoder_cluster.core.worker `
          --hidden-import=transcoder_cluster.core.controller `
          --hidden-import=transcoder_cluster.core.discovery `
          --hidden-import=transcoder_cluster.transcode `
          --hidden-import=transcoder_cluster.transcode.ffmpeg_wrapper `
          --hidden-import=transcoder_cluster.transcode.presets `
          --hidden-import=transcoder_cluster.utils `
          --hidden-import=transcoder_cluster.utils.config `
          --hidden-import=transcoder_cluster.utils.logger `
          --hidden-import=requests `
          --hidden-import=ffmpeg `
          --collect-all requests `
          --collect-all certifi `
          gui/worker_app.py --clean --noconfirm
    
    - name: Build Controller EXE
      run: |
        pyinstaller --onefile --windowed --name tc-control-gui `
          --hidden-import=transcoder_cluster `
          --hidden-import=transcoder_cluster.core `
          --hidden-import=transcoder_cluster.core.worker `
          --hidden-import=transcoder_cluster.core.controller `
          --hidden-import=transcoder_cluster.core.discovery `
          --hidden-import=transcoder_cluster.transcode `
          --hidden-import=transcoder_cluster.transcode.ffmpeg_wrapper `
          --hidden-import=transcoder_cluster.transcode.presets `
          --hidden-import=transcoder_cluster.utils `
          --hidden-import=transcoder_cluster.utils.config `
          --hidden-import=transcoder_cluster.utils.logger `
          --hidden-import=requests `
          --hidden-import=ffmpeg `
          --collect-all requests `
          --collect-all certifi `
          gui/controller_app.py --clean --noconfirm
    
    - name: Upload Worker EXE
      uses: actions/upload-artifact@v4
      with:
        name: tc-worker-gui
        path: dist/tc-worker-gui.exe
    
    - name: Upload Controller EXE
      uses: actions/upload-artifact@v4
      with:
        name: tc-control-gui
        path: dist/tc-control-gui.exe

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        pip install -e .

    - name: Build macOS GUI apps
      run: |
        pyinstaller scripts/build.spec --clean --noconfirm
        mkdir -p dist/transcoder-cluster-macos-${{ matrix.arch }}
        cp -R dist/tc-worker-gui* dist/transcoder-cluster-macos-${{ matrix.arch }}/
        cp -R dist/tc-control-gui* dist/transcoder-cluster-macos-${{ matrix.arch }}/
        ditto -c -k --sequesterRsrc --keepParent \
          dist/transcoder-cluster-macos-${{ matrix.arch }} \
          dist/transcoder-cluster-macos-${{ matrix.arch }}.zip

    - name: Upload macOS package
      uses: actions/upload-artifact@v4
      with:
        name: transcoder-cluster-macos-${{ matrix.arch }}
        path: dist/transcoder-cluster-macos-${{ matrix.arch }}.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

    - name: Download Worker EXE
      uses: actions/download-artifact@v4
      with:
        name: tc-worker-gui
        path: artifacts/
    
    - name: Download Controller EXE
      uses: actions/download-artifact@v4
      with:
        name: tc-control-gui
        path: artifacts/

    - name: Download macOS Intel package
      uses: actions/download-artifact@v4
      with:
        name: transcoder-cluster-macos-x86_64
        path: artifacts/

    - name: Download macOS Apple Silicon package
      uses: actions/download-artifact@v4
      with:
        name: transcoder-cluster-macos-arm64
        path: artifacts/

    - name: Prepare Release Notes
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
        NOTES_FILE=".github/release-notes/${TAG}.md"

        if [[ -f "$NOTES_FILE" ]]; then
          cp "$NOTES_FILE" release_body.md
          exit 0
        fi

        PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)"
        {
          echo "## 📥 下载"
          echo
          echo "| 文件 | 说明 |"
          echo "|------|------|"
          echo "| \`tc-worker-gui.exe\` | Worker 节点程序 |"
          echo "| \`tc-control-gui.exe\` | 主控端程序 |"
          echo
          echo "## 🚀 使用方法"
          echo
          echo "1. 下载 EXE 文件"
          echo "2. 双击运行即可（无需安装）"
          echo
          echo "## ⚠️ 注意事项"
          echo
          echo "- **需要安装 FFmpeg** 并添加到系统 PATH 才能进行视频转码"
          echo "- 首次运行可能需要允许防火墙通过"
          echo
          echo "## 📝 更新日志（详细）"
          echo
          if [[ -n "$PREV_TAG" ]]; then
            echo "对比范围: \`${PREV_TAG}...${TAG}\`"
            echo
            git log --no-merges --pretty=format:'- `%h` %s' "${PREV_TAG}..${TAG}"
          else
            echo "提交列表:"
            echo
            git log --no-merges --pretty=format:'- `%h` %s' "${TAG}"
          fi
          echo
        } > release_body.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        name: Transcoder Cluster ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        files: |
          artifacts/tc-worker-gui.exe
          artifacts/tc-control-gui.exe
          artifacts/transcoder-cluster-macos-x86_64.zip
          artifacts/transcoder-cluster-macos-arm64.zip
        body_path: release_body.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
